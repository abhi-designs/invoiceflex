<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found - InvoiceFlex</title>
  <link rel="icon" type="image/png" href="assets/aistudio/LOGO_50a3777b.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#007AFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InvoiceFlex">
  <script>(function(){var t=localStorage.getItem('invoiceflex_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <style>
    .error-screen-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app);
      padding: clamp(16px, 4vw, 24px);
    }
    .error-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: clamp(24px, 5vw, 44px) clamp(20px, 5vw, 36px);
      text-align: center;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
    }
    .error-num {
      font-size: clamp(3.5rem, 15vw, 6rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: clamp(1.2rem, 3.5vw, 1.5rem);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>

  <div class="error-screen-container">
    <div class="error-card">
      <div style="display: flex; justify-content: center; margin-bottom: 18px;">
        <div class="logo-icon" style="width: 48px; height: 48px; padding: 6px; border-radius: 13px;">
          <img src="assets/aistudio/LOGO_50a3777b.png" alt="InvoiceFlex">
        </div>
      </div>
      <div class="error-num">404</div>
      <h1 class="error-title">Endpoint Ledger Not Found</h1>
      <p class="error-desc">
        The requested address route or document specification does not exist in the billing network registry. It might have been deleted, renamed, or temporarily suspended.
      </p>
      
      <a href="dashboard.html" class="btn btn-primary" style="width: 100%; justify-content: center;">
        <svg class="icon-svg" style="width:16px; height:16px;" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return to Dashboard
      </a>
    </div>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/supabase-bridge.js" defer></script>
  <script src="assets/js/supabase-layer.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
