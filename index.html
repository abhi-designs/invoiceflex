<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - InvoiceFlex</title>
  <link rel="icon" type="image/png" href="/assets/aistudio/LOGO_50a3777b.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#007AFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InvoiceFlex">
  <script>(function(){var t=localStorage.getItem('invoiceflex_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <style>
    body {
      background-color: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 800;
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      color: var(--text-main);
      margin-bottom: 24px;
    }
    .login-logo .logo-icon {
      width: 44px;
      height: 44px;
      padding: 5px;
      border-radius: 12px;
    }
    .login-logo span {
      color: var(--primary);
    }
    .login-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: clamp(24px, 4.5vw, 36px) clamp(18px, 4.5vw, 32px);
      box-shadow: var(--shadow-lg);
    }
    .login-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .login-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 22px;
    }
    .auth-error-box {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: var(--danger-light);
      color: var(--danger-dark);
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 59, 48, 0.25);
    }
    .active-session-box {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: var(--primary-light);
      border: 1px solid rgba(0, 122, 255, 0.2);
      margin-bottom: 18px;
      font-size: 0.8125rem;
      color: var(--text-main);
    }
    .login-link {
      color: var(--primary);
      font-weight: 600;
      transition: color var(--transition-speed);
    }
    .login-link:hover {
      color: var(--primary-hover);
    }
    .login-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-light);
      font-size: 0.75rem;
      margin: 22px 0;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .login-divider:not(:empty)::before {
      margin-right: .5em;
    }
    .login-divider:not(:empty)::after {
      margin-left: .5em;
    }
    .register-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">
      <div class="logo-icon"><img src="/assets/aistudio/LOGO_50a3777b.png" alt="InvoiceFlex"></div>
      <div class="logo-text">Invoice<span>Flex</span></div>
    </div>
    
    <div class="login-card">
      <div id="active-session-banner" class="active-session-box"></div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-desc">Sign in with your registered company email, or register a new business account.</p>

      <div id="login-error-box" class="auth-error-box" role="alert"></div>
      
      <form id="login-form" action="dashboard.html" method="get" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">
            Email Address <span class="required-star">*</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="name@company.com" 
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">
              Password <span class="required-star">*</span>
            </label>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>
        
        <div class="form-group" style="margin-top: 12px; margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%;">
            <label class="checkbox-group" for="remember-me">
              <input type="checkbox" id="remember-me" name="remember" checked>
              <span class="custom-checkbox">
                <svg class="icon-svg" viewBox="0 0 24 24" style="width:12px; height:12px; color:white;"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" fill="none"/></svg>
              </span>
              <span style="font-size: 0.8125rem; color: var(--text-muted);">Remember this device</span>
            </label>
            <a href="#forgot-password" id="forgot-password-link" class="login-link" style="font-size: 0.8125rem;">Forgot Password?</a>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
          Sign In
        </button>
      </form>
    </div>
    
    <p class="register-footer">
      New to InvoiceFlex? <a href="register.html" class="login-link">Register Company</a>
    </p>
  </div>

  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/supabase-bridge.js" defer></script>
  <script src="/assets/js/supabase-layer.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
